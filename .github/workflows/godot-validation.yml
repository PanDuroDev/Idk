name: Godot validation

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  linux-headless-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Godot 4.7.2
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip -O godot.zip
          unzip -q godot.zip
          chmod +x Godot_v4.7.2-stable_linux.x86_64

      - name: Import project and parse scripts
        run: ./Godot_v4.7.2-stable_linux.x86_64 --headless --editor --path . --quit

      - name: Launch project headlessly
        run: ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . --quit-after 3

      - name: Run gameplay smoke test
        run: ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script res://tests/headless_smoke_test.gd

  windows-headless-validation:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Godot 4.7.2
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Invoke-WebRequest -Uri "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_win64.exe.zip" -OutFile godot.zip
          Expand-Archive -Path godot.zip -DestinationPath godot
          $godot = ".\godot\Godot_v4.7.2-stable_win64.exe"
          if (-not (Test-Path $godot)) {
            throw "Godot 4.7.2 Windows executable was not found in the release archive."
          }

      - name: Import, launch, and test with checked logs
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $godot = ".\godot\Godot_v4.7.2-stable_win64.exe"

          function Invoke-GodotChecked {
            param(
              [string[]]$Arguments,
              [string]$LogPath,
              [string[]]$RequiredMarkers = @()
            )

            $argumentsWithLog = @($Arguments) + @("--log-file", $LogPath)
            $process = Start-Process -FilePath $godot -ArgumentList $argumentsWithLog -NoNewWindow -PassThru -Wait
            $exitCode = $process.ExitCode

            if ($exitCode -ne 0) {
              throw "Godot failed for ${LogPath} with exit code $exitCode."
            }
            if (-not (Test-Path $LogPath)) {
              throw "Godot did not create the expected log file: $LogPath"
            }

            $logText = Get-Content -Path $LogPath -Raw
            Write-Output $logText
            if ($logText -match "SCRIPT ERROR:|Parse Error:|Compile Error:|ERROR:|WORLDBREAK_SMOKE_TEST_FAILED") {
              throw "Godot emitted an error while running ${LogPath}."
            }
            foreach ($marker in $RequiredMarkers) {
              if ($logText -notmatch [regex]::Escape($marker)) {
                throw "Expected Godot success marker was missing from ${LogPath}: $marker"
              }
            }
          }

          # --import waits for project resources and the global class registry.
          Invoke-GodotChecked -Arguments @("--headless", "--path", ".", "--import") -LogPath "godot-import.log"

          $classCachePath = ".\.godot\global_script_class_cache.cfg"
          if (-not (Test-Path $classCachePath)) {
            throw "Godot import did not create the global script class cache."
          }
          $classCache = Get-Content -Path $classCachePath -Raw
          if ($classCache -notmatch "DestructionMaterialProfile") {
            throw "The global script class cache is missing DestructionMaterialProfile."
          }

          Invoke-GodotChecked -Arguments @("--headless", "--path", ".", "--quit-after", "3") -LogPath "godot-launch.log"

          Invoke-GodotChecked -Arguments @("--headless", "--path", ".", "--script", "res://tests/headless_smoke_test.gd") -LogPath "godot-smoke.log" -RequiredMarkers @(
            "WORLDBREAK_PHYSICS_COLLAPSE_OK:",
            "WORLDBREAK_SMOKE_TEST_OK:"
          )
