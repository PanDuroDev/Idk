name: Godot validation

on:
  push:
    branches:
      - main
      - 'ai/phase-3/**'
  pull_request:
    branches:
      - main

jobs:
  linux-headless-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Godot 4.7.2
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip -O godot.zip
          unzip -q godot.zip
          chmod +x Godot_v4.7.2-stable_linux.x86_64

      - name: Import project and parse scripts
        run: |
          ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . --import --log-file godot-import.log
          if grep -Eq 'SCRIPT ERROR:|(^|[[:space:]])ERROR:' godot-import.log; then
            cat godot-import.log
            exit 1
          fi

      - name: Launch project headlessly
        run: |
          ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . --quit-after 3 --log-file godot-launch.log
          if grep -Eq 'SCRIPT ERROR:|(^|[[:space:]])ERROR:' godot-launch.log; then
            cat godot-launch.log
            exit 1
          fi

      - name: Run gameplay smoke test
        run: |
          ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script res://tests/headless_smoke_test.gd --log-file godot-smoke.log
          if ! grep -q 'WORLDBREAK_REPEAT_CYCLES_OK' godot-smoke.log; then
            cat godot-smoke.log
            echo "Repeated collapse/reset regression did not report its success marker."
            exit 1
          fi
          if ! grep -q 'WORLDBREAK_SMOKE_TEST_OK' godot-smoke.log; then
            cat godot-smoke.log
            echo "Gameplay smoke test did not report its success marker."
            exit 1
          fi
          if grep -Eq 'SCRIPT ERROR:|(^|[[:space:]])ERROR:|WORLDBREAK_SMOKE_TEST_FAILED' godot-smoke.log; then
            cat godot-smoke.log
            exit 1
          fi

      - name: Run isolated terrain chunk test
        run: |
          ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script res://tests/terrain/terrain_chunk_data_test.gd --log-file godot-terrain.log
          if ! grep -q 'WORLDBREAK_TERRAIN_CHUNK_MESH_OK' godot-terrain.log; then
            cat godot-terrain.log
            echo "Terrain chunk test did not report its success marker."
            exit 1
          fi
          if grep -Eq 'SCRIPT ERROR:|(^|[[:space:]])ERROR:' godot-terrain.log; then
            cat godot-terrain.log
            exit 1
          fi

      - name: Run terrain deformation test
        run: |
          ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script res://tests/terrain/terrain_deformation_test.gd --log-file godot-deformation.log
          if ! grep -q 'WORLDBREAK_TERRAIN_DEFORMATION_OK' godot-deformation.log; then
            cat godot-deformation.log
            echo "Terrain deformation test did not report its success marker."
            exit 1
          fi
          if grep -Eq 'SCRIPT ERROR:|(^|[[:space:]])ERROR:' godot-deformation.log; then
            cat godot-deformation.log
            exit 1
          fi

      - name: Run terrain collision queue test
        run: |
          ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script res://tests/terrain/terrain_collision_queue_test.gd --log-file godot-collision.log
          if ! grep -q 'WORLDBREAK_TERRAIN_COLLISION_OK' godot-collision.log; then
            cat godot-collision.log
            echo "Terrain collision test did not report its success marker."
            exit 1
          fi
          if grep -Eq 'SCRIPT ERROR:|(^|[[:space:]])ERROR:' godot-collision.log; then
            cat godot-collision.log
            exit 1
          fi

      - name: Run terrain budget and profile test
        run: |
          ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script res://tests/terrain/terrain_budget_profile_test.gd --log-file godot-budget.log
          if ! grep -q 'WORLDBREAK_TERRAIN_BUDGETS_OK' godot-budget.log; then
            cat godot-budget.log
            echo "Terrain budget test did not report its success marker."
            exit 1
          fi
          if grep -Eq 'SCRIPT ERROR:|(^|[[:space:]])ERROR:' godot-budget.log; then
            cat godot-budget.log
            exit 1
          fi

      - name: Run terrain mesh queue test
        run: |
          ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script res://tests/terrain/terrain_mesh_queue_test.gd --log-file godot-mesh-queue.log
          if ! grep -q 'WORLDBREAK_TERRAIN_MESH_QUEUE_OK' godot-mesh-queue.log; then
            cat godot-mesh-queue.log
            echo "Terrain mesh queue test did not report its success marker."
            exit 1
          fi
          if grep -Eq 'SCRIPT ERROR:|(^|[[:space:]])ERROR:' godot-mesh-queue.log; then
            cat godot-mesh-queue.log
            exit 1
          fi

  windows-headless-validation:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Godot 4.7.2
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Invoke-WebRequest -Uri "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_win64.exe.zip" -OutFile godot.zip
          Expand-Archive -Path godot.zip -DestinationPath godot
          if (-not (Test-Path ".\godot\Godot_v4.7.2-stable_win64.exe")) {
            throw "Godot 4.7.2 Windows executable was not found in the release archive."
          }

      - name: Import project and parse scripts
        shell: pwsh
        run: |
          $godot = ".\godot\Godot_v4.7.2-stable_win64.exe"
          & $godot --headless --path . --import --log-file godot-import.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (Select-String -Path "godot-import.log" -Pattern "SCRIPT ERROR:|(^|\s)ERROR:" -Quiet) {
            Get-Content "godot-import.log"
            throw "Godot import reported script or engine errors."
          }

      - name: Launch project headlessly
        shell: pwsh
        run: |
          $godot = ".\godot\Godot_v4.7.2-stable_win64.exe"
          & $godot --headless --path . --quit-after 3 --log-file godot-launch.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (Select-String -Path "godot-launch.log" -Pattern "SCRIPT ERROR:|(^|\s)ERROR:" -Quiet) {
            Get-Content "godot-launch.log"
            throw "Headless launch reported script or engine errors."
          }

      - name: Run gameplay smoke test
        shell: pwsh
        run: |
          $godot = ".\godot\Godot_v4.7.2-stable_win64.exe"
          & $godot --headless --path . --script res://tests/headless_smoke_test.gd --log-file godot-smoke.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $log = Get-Content "godot-smoke.log" -Raw
          if ($log -notmatch "WORLDBREAK_REPEAT_CYCLES_OK") {
            Write-Output $log
            throw "Repeated collapse/reset regression did not report its success marker."
          }
          if ($log -notmatch "WORLDBREAK_SMOKE_TEST_OK") {
            Write-Output $log
            throw "Gameplay smoke test did not report its success marker."
          }
          if ($log -match "SCRIPT ERROR:|(^|\s)ERROR:|WORLDBREAK_SMOKE_TEST_FAILED") {
            Write-Output $log
            throw "Gameplay smoke test reported errors."
          }

      
      - name: Run isolated terrain chunk test
        shell: pwsh
        run: |
          $godot = ".\godot\Godot_v4.7.2-stable_win64.exe"
          & $godot --headless --path . --script res://tests/terrain/terrain_chunk_data_test.gd --log-file godot-terrain.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $terrainLog = Get-Content "godot-terrain.log" -Raw
          if ($terrainLog -notmatch "WORLDBREAK_TERRAIN_CHUNK_MESH_OK") {
            Write-Output $terrainLog
            throw "Terrain chunk test did not report its success marker."
          }
          if ($terrainLog -match "SCRIPT ERROR:|(^|\s)ERROR:") {
            Write-Output $terrainLog
            throw "Terrain chunk test reported errors."
          }

      - name: Run terrain deformation test
        shell: pwsh
        run: |
          $godot = ".\\godot\\Godot_v4.7.2-stable_win64.exe"
          & $godot --headless --path . --script res://tests/terrain/terrain_deformation_test.gd --log-file godot-deformation.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $deformationLog = Get-Content "godot-deformation.log" -Raw
          if ($deformationLog -notmatch "WORLDBREAK_TERRAIN_DEFORMATION_OK") {
            Write-Output $deformationLog
            throw "Terrain deformation test did not report its success marker."
          }
          if ($deformationLog -match "SCRIPT ERROR:|(^|\\s)ERROR:") {
            Write-Output $deformationLog
            throw "Terrain deformation test reported errors."
          }

      - name: Run terrain collision queue test
        shell: pwsh
        run: |
          $godot = ".\\godot\\Godot_v4.7.2-stable_win64.exe"
          & $godot --headless --path . --script res://tests/terrain/terrain_collision_queue_test.gd --log-file godot-collision.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $collisionLog = Get-Content "godot-collision.log" -Raw
          if ($collisionLog -notmatch "WORLDBREAK_TERRAIN_COLLISION_OK") {
            Write-Output $collisionLog
            throw "Terrain collision test did not report its success marker."
          }
          if ($collisionLog -match "SCRIPT ERROR:|(^|\\s)ERROR:") {
            Write-Output $collisionLog
            throw "Terrain collision test reported errors."
          }

      - name: Run terrain budget and profile test
        shell: pwsh
        run: |
          $godot = ".\\godot\\Godot_v4.7.2-stable_win64.exe"
          & $godot --headless --path . --script res://tests/terrain/terrain_budget_profile_test.gd --log-file godot-budget.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $budgetLog = Get-Content "godot-budget.log" -Raw
          if ($budgetLog -notmatch "WORLDBREAK_TERRAIN_BUDGETS_OK") {
            Write-Output $budgetLog
            throw "Terrain budget test did not report its success marker."
          }
          if ($budgetLog -match "SCRIPT ERROR:|(^|\\s)ERROR:") {
            Write-Output $budgetLog
            throw "Terrain budget test reported errors."
          }

      - name: Run terrain mesh queue test
        shell: pwsh
        run: |
          $godot = ".\\godot\\Godot_v4.7.2-stable_win64.exe"
          & $godot --headless --path . --script res://tests/terrain/terrain_mesh_queue_test.gd --log-file godot-mesh-queue.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $meshQueueLog = Get-Content "godot-mesh-queue.log" -Raw
          if ($meshQueueLog -notmatch "WORLDBREAK_TERRAIN_MESH_QUEUE_OK") {
            Write-Output $meshQueueLog
            throw "Terrain mesh queue test did not report its success marker."
          }
          if ($meshQueueLog -match "SCRIPT ERROR:|(^|\\s)ERROR:") {
            Write-Output $meshQueueLog
            throw "Terrain mesh queue test reported errors."
          }
