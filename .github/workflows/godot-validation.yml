name: Godot validation

on:
  push:
    branches:
      - feature/worldbreak-godot-foundation
  pull_request:
    branches:
      - main

jobs:
  headless-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Godot 4.7.2
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip -O godot.zip
          unzip -q godot.zip
          chmod +x Godot_v4.7.2-stable_linux.x86_64

      - name: Import project and parse scripts
        run: ./Godot_v4.7.2-stable_linux.x86_64 --headless --editor --path . --quit

      - name: Launch project headlessly
        run: ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . --quit-after 3

      - name: Run gameplay smoke test
        run: ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script res://tests/headless_smoke_test.gd
