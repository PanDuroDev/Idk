name: Godot validation

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
      - 'ai/phase-3/**'
      - 'ai/phase-4/**'
      - 'ai/phase-5/**'
  pull_request:
    branches:
      - '**'

jobs:
  linux-headless-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Godot 4.7.2
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip -O godot.zip
          unzip -q godot.zip
          chmod +x Godot_v4.7.2-stable_linux.x86_64

      - name: Import project and parse scripts
        run: |
          set +e
          ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . --import --log-file godot-import.log > godot-import-console.log 2>&1
          test_status=$?
          set -e
          cat godot-import-console.log
          if [ -f godot-import.log ]; then cat godot-import.log; fi
          if [ "$test_status" -ne 0 ]; then exit "$test_status"; fi
          if grep -Eq 'SCRIPT ERROR:|(^|[[:space:]])ERROR:|Parse Error:|Failed to load script' godot-import-console.log godot-import.log; then
            exit 1
          fi

      - name: Launch project headlessly
        run: |
          set +e
          ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . --quit-after 3 --log-file godot-launch.log > godot-launch-console.log 2>&1
          test_status=$?
          set -e
          cat godot-launch-console.log
          if [ -f godot-launch.log ]; then cat godot-launch.log; fi
          if [ "$test_status" -ne 0 ]; then exit "$test_status"; fi
          if grep -Eq 'SCRIPT ERROR:|(^|[[:space:]])ERROR:|Parse Error:|Failed to load script' godot-launch-console.log godot-launch.log; then
            exit 1
          fi

      - name: Run gameplay smoke test
        run: |
          set +e
          ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script res://tests/headless_smoke_test.gd --log-file godot-smoke.log > godot-smoke-console.log 2>&1
          test_status=$?
          set -e
          cat godot-smoke-console.log
          if [ -f godot-smoke.log ]; then cat godot-smoke.log; fi
          if [ "$test_status" -ne 0 ]; then exit "$test_status"; fi
          for marker in WORLDBREAK_MATERIAL_AUTHORING_OK WORLDBREAK_MATERIAL_PREVIEW_OK WORLDBREAK_BUILDING_DEFINITIONS_OK WORLDBREAK_REPEAT_CYCLES_OK WORLDBREAK_SMOKE_TEST_OK; do
            if ! grep -q "$marker" godot-smoke-console.log && ! grep -q "$marker" godot-smoke.log; then
              echo "Gameplay smoke test did not report required marker: $marker"
              exit 1
            fi
          done
          if grep -Eq 'SCRIPT ERROR:|(^|[[:space:]])ERROR:|Parse Error:|Failed to load script|WORLDBREAK_SMOKE_TEST_FAILED' godot-smoke-console.log godot-smoke.log; then
            exit 1
          fi

      - name: Run configuration persistence test
        run: |
          set +e
          ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script res://tests/phase2/configuration_persistence_test.gd --log-file godot-config-console.log > godot-config.log 2>&1
          test_status=$?
          set -e
          cat godot-config.log
          if [ -f godot-config-console.log ]; then cat godot-config-console.log; fi
          if [ "$test_status" -ne 0 ]; then exit "$test_status"; fi
          if ! grep -q 'WORLDBREAK_CONFIGURATION_PERSISTENCE_OK' godot-config.log && ! grep -q 'WORLDBREAK_CONFIGURATION_PERSISTENCE_OK' godot-config-console.log; then
            echo "Configuration persistence test did not report its success marker."
            exit 1
          fi
          if grep -Eq 'SCRIPT ERROR:|(^|[[:space:]])ERROR:|Parse Error:|Failed to load script|WORLDBREAK_CONFIGURATION_PERSISTENCE_FAILED' godot-config.log godot-config-console.log; then
            exit 1
          fi

      - name: Run isolated terrain chunk test
        run: |
          set +e
          ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script res://tests/terrain/terrain_chunk_data_test.gd --log-file godot-terrain.log > godot-terrain-console.log 2>&1
          test_status=$?
          set -e
          cat godot-terrain-console.log
          if [ -f godot-terrain.log ]; then cat godot-terrain.log; fi
          if [ "$test_status" -ne 0 ]; then exit "$test_status"; fi
          if ! grep -q 'WORLDBREAK_TERRAIN_CHUNK_MESH_OK' godot-terrain-console.log && ! grep -q 'WORLDBREAK_TERRAIN_CHUNK_MESH_OK' godot-terrain.log; then
            echo "Terrain chunk test did not report its success marker."
            exit 1
          fi
          if grep -Eq 'SCRIPT ERROR:|(^|[[:space:]])ERROR:|Parse Error:|Failed to load script' godot-terrain-console.log godot-terrain.log; then
            exit 1
          fi

      - name: Run terrain deformation test
        run: |
          set +e
          timeout --signal=TERM 30s ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script res://tests/terrain/terrain_deformation_test.gd --quit-after 120 --log-file godot-deformation.log > godot-deformation-console.log 2>&1
          test_status=$?
          set -e
          cat godot-deformation-console.log
          if [ -f godot-deformation.log ]; then cat godot-deformation.log; fi
          if [ "$test_status" -ne 0 ]; then exit "$test_status"; fi
          if ! grep -q 'WORLDBREAK_TERRAIN_DEFORMATION_OK' godot-deformation-console.log && ! grep -q 'WORLDBREAK_TERRAIN_DEFORMATION_OK' godot-deformation.log; then
            echo "Terrain deformation test did not report its success marker."
            exit 1
          fi
          if grep -Eq 'SCRIPT ERROR:|(^|[[:space:]])ERROR:|Parse Error:|Failed to load script' godot-deformation-console.log godot-deformation.log; then
            exit 1
          fi

      - name: Run terrain collision queue test
        run: |
          ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script res://tests/terrain/terrain_collision_queue_test.gd --log-file godot-collision.log
          if ! grep -q 'WORLDBREAK_TERRAIN_COLLISION_OK' godot-collision.log; then
            cat godot-collision.log
            echo "Terrain collision test did not report its success marker."
            exit 1
          fi
          if grep -Eq 'SCRIPT ERROR:|(^|[[:space:]])ERROR:' godot-collision.log; then
            cat godot-collision.log
            exit 1
          fi

      - name: Run terrain budget and profile test
        run: |
          ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script res://tests/terrain/terrain_budget_profile_test.gd --log-file godot-budget.log
          if ! grep -q 'WORLDBREAK_TERRAIN_BUDGETS_OK' godot-budget.log; then
            cat godot-budget.log
            echo "Terrain budget test did not report its success marker."
            exit 1
          fi
          if grep -Eq 'SCRIPT ERROR:|(^|[[:space:]])ERROR:' godot-budget.log; then
            cat godot-budget.log
            exit 1
          fi

      - name: Run terrain mesh queue test
        run: |
          ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script res://tests/terrain/terrain_mesh_queue_test.gd --log-file godot-mesh-queue.log
          if ! grep -q 'WORLDBREAK_TERRAIN_MESH_QUEUE_OK' godot-mesh-queue.log; then
            cat godot-mesh-queue.log
            echo "Terrain mesh queue test did not report its success marker."
            exit 1
          fi
          if grep -Eq 'SCRIPT ERROR:|(^|[[:space:]])ERROR:' godot-mesh-queue.log; then
            cat godot-mesh-queue.log
            exit 1
          fi

      - name: Run terrain world coordinator test
        run: |
          ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script res://tests/terrain/terrain_world_test.gd --log-file godot-terrain-world.log
          if ! grep -q 'WORLDBREAK_TERRAIN_WORLD_OK' godot-terrain-world.log; then
            cat godot-terrain-world.log
            echo "Terrain world coordinator test did not report its success marker."
            exit 1
          fi
          if grep -Eq 'SCRIPT ERROR:|(^|[[:space:]])ERROR:' godot-terrain-world.log; then
            cat godot-terrain-world.log
            exit 1
          fi

      - name: Run terrain gameplay integration test
        run: |
          ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script res://tests/terrain/terrain_integration_test.gd --log-file godot-terrain-integration.log
          if ! grep -q 'WORLDBREAK_TERRAIN_INTEGRATION_OK' godot-terrain-integration.log; then
            cat godot-terrain-integration.log
            echo "Terrain gameplay integration test did not report its success marker."
            exit 1
          fi
          if grep -Eq 'SCRIPT ERROR:|(^|[[:space:]])ERROR:' godot-terrain-integration.log; then
            cat godot-terrain-integration.log
            exit 1
          fi

      - name: Run world loading test
        run: |
          ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script res://tests/phase4/world_loading_test.gd --log-file godot-world-loading.log
          if ! grep -q 'WORLDBREAK_WORLD_LOADING_OK' godot-world-loading.log; then
            cat godot-world-loading.log
            echo "World loading test did not report its success marker."
            exit 1
          fi
          if grep -Eq 'SCRIPT ERROR:|(^|[[:space:]])ERROR:|Parse Error:|Failed to load script' godot-world-loading.log; then
            cat godot-world-loading.log
            exit 1
          fi

      - name: Run simulation tools test
        run: |
          set +e
          ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script res://tests/phase5/simulation_tools_test.gd --log-file godot-simulation-tools.log > godot-simulation-tools-console.log 2>&1
          test_status=$?
          set -e
          cat godot-simulation-tools-console.log
          if [ -f godot-simulation-tools.log ]; then cat godot-simulation-tools.log; fi
          if [ "$test_status" -ne 0 ]; then exit "$test_status"; fi
          if ! grep -q 'WORLDBREAK_SIMULATION_TOOLS_OK' godot-simulation-tools-console.log && ! grep -q 'WORLDBREAK_SIMULATION_TOOLS_OK' godot-simulation-tools.log; then
            echo "Simulation tools test did not report its success marker."
            exit 1
          fi
          if grep -Eq 'SCRIPT ERROR:|(^|[[:space:]])ERROR:|Parse Error:|Failed to load script|WORLDBREAK_SIMULATION_TOOLS_FAILED' godot-simulation-tools-console.log godot-simulation-tools.log; then
            exit 1
          fi

  windows-headless-validation:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Godot 4.7.2
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Invoke-WebRequest -Uri "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_win64.exe.zip" -OutFile godot.zip
          Expand-Archive -Path godot.zip -DestinationPath godot
          if (-not (Test-Path ".\godot\Godot_v4.7.2-stable_win64.exe")) {
            throw "Godot 4.7.2 Windows executable was not found in the release archive."
          }

      - name: Import project and parse scripts
        shell: pwsh
        run: |
          $godot = ".\godot\Godot_v4.7.2-stable_win64.exe"
          $engineOutput = & $godot --headless --path . --import --log-file godot-import.log 2>&1
          $testExitCode = $LASTEXITCODE
          $consoleLog = ($engineOutput | Out-String)
          $engineLog = if (Test-Path "godot-import.log") { Get-Content "godot-import.log" -Raw } else { "" }
          $combinedLog = $consoleLog + [Environment]::NewLine + $engineLog
          Write-Output $combinedLog
          if ($testExitCode -ne 0) { exit $testExitCode }
          if ($combinedLog -match "SCRIPT ERROR:|(^|\s)ERROR:|Parse Error:|Failed to load script") {
            throw "Godot import reported script or engine errors."
          }

      - name: Launch project headlessly
        shell: pwsh
        run: |
          $godot = ".\godot\Godot_v4.7.2-stable_win64.exe"
          $engineOutput = & $godot --headless --path . --quit-after 3 --log-file godot-launch.log 2>&1
          $testExitCode = $LASTEXITCODE
          $consoleLog = ($engineOutput | Out-String)
          $engineLog = if (Test-Path "godot-launch.log") { Get-Content "godot-launch.log" -Raw } else { "" }
          $combinedLog = $consoleLog + [Environment]::NewLine + $engineLog
          Write-Output $combinedLog
          if ($testExitCode -ne 0) { exit $testExitCode }
          if ($combinedLog -match "SCRIPT ERROR:|(^|\s)ERROR:|Parse Error:|Failed to load script") {
            throw "Headless launch reported script or engine errors."
          }

      - name: Run gameplay smoke test
        shell: pwsh
        run: |
          $godot = ".\godot\Godot_v4.7.2-stable_win64.exe"
          $engineOutput = & $godot --headless --path . --script res://tests/headless_smoke_test.gd --log-file godot-smoke.log 2>&1
          $testExitCode = $LASTEXITCODE
          $consoleLog = ($engineOutput | Out-String)
          $engineLog = if (Test-Path "godot-smoke.log") { Get-Content "godot-smoke.log" -Raw } else { "" }
          $combinedLog = $consoleLog + [Environment]::NewLine + $engineLog
          Write-Output $combinedLog
          if ($testExitCode -ne 0) { exit $testExitCode }
          foreach ($marker in @("WORLDBREAK_MATERIAL_AUTHORING_OK", "WORLDBREAK_MATERIAL_PREVIEW_OK", "WORLDBREAK_BUILDING_DEFINITIONS_OK", "WORLDBREAK_REPEAT_CYCLES_OK", "WORLDBREAK_SMOKE_TEST_OK")) {
            if ($combinedLog -notmatch [regex]::Escape($marker)) {
              throw "Gameplay smoke test did not report required marker: $marker"
            }
          }
          if ($combinedLog -match "SCRIPT ERROR:|(^|\s)ERROR:|Parse Error:|Failed to load script|WORLDBREAK_SMOKE_TEST_FAILED") {
            throw "Gameplay smoke test reported script or engine errors."
          }

      - name: Run configuration persistence test
        shell: pwsh
        run: |
          $godot = ".\godot\Godot_v4.7.2-stable_win64.exe"
          $configOutput = & $godot --headless --path . --script res://tests/phase2/configuration_persistence_test.gd --log-file godot-config.log 2>&1
          $testExitCode = $LASTEXITCODE
          $consoleLog = ($configOutput | Out-String)
          $engineLog = if (Test-Path "godot-config.log") { Get-Content "godot-config.log" -Raw } else { "" }
          $combinedLog = $consoleLog + [Environment]::NewLine + $engineLog
          Write-Output $combinedLog
          if ($testExitCode -ne 0) { exit $testExitCode }
          if ($combinedLog -notmatch "WORLDBREAK_CONFIGURATION_PERSISTENCE_OK") {
            throw "Configuration persistence test did not report its success marker."
          }
          if ($combinedLog -match "SCRIPT ERROR:|(^|\s)ERROR:|Parse Error:|Failed to load script|WORLDBREAK_CONFIGURATION_PERSISTENCE_FAILED") {
            throw "Configuration persistence test reported script or engine errors."
          }

      
      - name: Run isolated terrain chunk test
        shell: pwsh
        run: |
          $godot = ".\godot\Godot_v4.7.2-stable_win64.exe"
          $terrainOutput = & $godot --headless --path . --script res://tests/terrain/terrain_chunk_data_test.gd --log-file godot-terrain.log 2>&1
          $testExitCode = $LASTEXITCODE
          $consoleLog = ($terrainOutput | Out-String)
          $engineLog = if (Test-Path "godot-terrain.log") { Get-Content "godot-terrain.log" -Raw } else { "" }
          $combinedLog = $consoleLog + [Environment]::NewLine + $engineLog
          Write-Output $combinedLog
          if ($testExitCode -ne 0) { exit $testExitCode }
          if ($combinedLog -notmatch "WORLDBREAK_TERRAIN_CHUNK_MESH_OK") {
            throw "Terrain chunk test did not report its success marker."
          }
          if ($combinedLog -match "SCRIPT ERROR:|(^|\s)ERROR:|Parse Error:|Failed to load script") {
            throw "Terrain chunk test reported script or engine errors."
          }

      - name: Run terrain deformation test
        shell: pwsh
        run: |
          $godot = ".\godot\Godot_v4.7.2-stable_win64.exe"
          $deformationOutput = & $godot --headless --path . --script res://tests/terrain/terrain_deformation_test.gd --quit-after 120 --log-file godot-deformation.log 2>&1
          $testExitCode = $LASTEXITCODE
          $consoleLog = ($deformationOutput | Out-String)
          $engineLog = if (Test-Path "godot-deformation.log") { Get-Content "godot-deformation.log" -Raw } else { "" }
          $combinedLog = $consoleLog + [Environment]::NewLine + $engineLog
          Write-Output $combinedLog
          if ($testExitCode -ne 0) { exit $testExitCode }
          if ($combinedLog -notmatch "WORLDBREAK_TERRAIN_DEFORMATION_OK") {
            throw "Terrain deformation test did not report its success marker."
          }
          if ($combinedLog -match "SCRIPT ERROR:|(^|\s)ERROR:|Parse Error:|Failed to load script") {
            throw "Terrain deformation test reported script or engine errors."
          }

      - name: Run terrain collision queue test
        shell: pwsh
        run: |
          $godot = ".\\godot\\Godot_v4.7.2-stable_win64.exe"
          & $godot --headless --path . --script res://tests/terrain/terrain_collision_queue_test.gd --log-file godot-collision.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $collisionLog = Get-Content "godot-collision.log" -Raw
          if ($collisionLog -notmatch "WORLDBREAK_TERRAIN_COLLISION_OK") {
            Write-Output $collisionLog
            throw "Terrain collision test did not report its success marker."
          }
          if ($collisionLog -match "SCRIPT ERROR:|(^|\\s)ERROR:") {
            Write-Output $collisionLog
            throw "Terrain collision test reported errors."
          }

      - name: Run terrain budget and profile test
        shell: pwsh
        run: |
          $godot = ".\\godot\\Godot_v4.7.2-stable_win64.exe"
          & $godot --headless --path . --script res://tests/terrain/terrain_budget_profile_test.gd --log-file godot-budget.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $budgetLog = Get-Content "godot-budget.log" -Raw
          if ($budgetLog -notmatch "WORLDBREAK_TERRAIN_BUDGETS_OK") {
            Write-Output $budgetLog
            throw "Terrain budget test did not report its success marker."
          }
          if ($budgetLog -match "SCRIPT ERROR:|(^|\\s)ERROR:") {
            Write-Output $budgetLog
            throw "Terrain budget test reported errors."
          }

      - name: Run terrain mesh queue test
        shell: pwsh
        run: |
          $godot = ".\\godot\\Godot_v4.7.2-stable_win64.exe"
          & $godot --headless --path . --script res://tests/terrain/terrain_mesh_queue_test.gd --log-file godot-mesh-queue.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $meshQueueLog = Get-Content "godot-mesh-queue.log" -Raw
          if ($meshQueueLog -notmatch "WORLDBREAK_TERRAIN_MESH_QUEUE_OK") {
            Write-Output $meshQueueLog
            throw "Terrain mesh queue test did not report its success marker."
          }
          if ($meshQueueLog -match "SCRIPT ERROR:|(^|\\s)ERROR:") {
            Write-Output $meshQueueLog
            throw "Terrain mesh queue test reported errors."
          }

      - name: Run terrain world coordinator test
        shell: pwsh
        run: |
          $godot = ".\\godot\\Godot_v4.7.2-stable_win64.exe"
          & $godot --headless --path . --script res://tests/terrain/terrain_world_test.gd --log-file godot-terrain-world.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $worldLog = Get-Content "godot-terrain-world.log" -Raw
          if ($worldLog -notmatch "WORLDBREAK_TERRAIN_WORLD_OK") {
            Write-Output $worldLog
            throw "Terrain world coordinator test did not report its success marker."
          }
          if ($worldLog -match "SCRIPT ERROR:|(^|\\s)ERROR:") {
            Write-Output $worldLog
            throw "Terrain world coordinator test reported errors."
          }

      - name: Run terrain gameplay integration test
        shell: pwsh
        run: |
          $godot = ".\\godot\\Godot_v4.7.2-stable_win64.exe"
          & $godot --headless --path . --script res://tests/terrain/terrain_integration_test.gd --log-file godot-terrain-integration.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $integrationLog = Get-Content "godot-terrain-integration.log" -Raw
          if ($integrationLog -notmatch "WORLDBREAK_TERRAIN_INTEGRATION_OK") {
            Write-Output $integrationLog
            throw "Terrain gameplay integration test did not report its success marker."
          }
          if ($integrationLog -match "SCRIPT ERROR:|(^|\\s)ERROR:") {
            Write-Output $integrationLog
            throw "Terrain gameplay integration test reported errors."
          }

      - name: Run world loading test
        shell: pwsh
        run: |
          $godot = ".\\godot\\Godot_v4.7.2-stable_win64.exe"
          & $godot --headless --path . --script res://tests/phase4/world_loading_test.gd --log-file godot-world-loading.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $worldLog = Get-Content "godot-world-loading.log" -Raw
          if ($worldLog -notmatch "WORLDBREAK_WORLD_LOADING_OK") {
            Write-Output $worldLog
            throw "World loading test did not report its success marker."
          }
          if ($worldLog -match "SCRIPT ERROR:|(^|\\s)ERROR:|Parse Error:|Failed to load script") {
            Write-Output $worldLog
            throw "World loading test reported errors."
          }

      - name: Run simulation tools test
        shell: pwsh
        run: |
          $godot = ".\godot\Godot_v4.7.2-stable_win64.exe"
          $engineOutput = & $godot --headless --path . --script res://tests/phase5/simulation_tools_test.gd --log-file godot-simulation-tools.log 2>&1
          $testExitCode = $LASTEXITCODE
          $consoleLog = ($engineOutput | Out-String)
          $engineLog = if (Test-Path "godot-simulation-tools.log") { Get-Content "godot-simulation-tools.log" -Raw } else { "" }
          $combinedLog = $consoleLog + [Environment]::NewLine + $engineLog
          Write-Output $combinedLog
          if ($testExitCode -ne 0) { exit $testExitCode }
          if ($combinedLog -notmatch "WORLDBREAK_SIMULATION_TOOLS_OK") {
            throw "Simulation tools test did not report its success marker."
          }
          if ($combinedLog -match "SCRIPT ERROR:|(^|\s)ERROR:|Parse Error:|Failed to load script|WORLDBREAK_SIMULATION_TOOLS_FAILED") {
            throw "Simulation tools test reported script or engine errors."
          }

